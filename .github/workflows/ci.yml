name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev,postgres]"
      - run: ruff check classpulse tests
      - run: pytest -q
      - name: Migrations apply cleanly
        run: python -c "from classpulse.main import run_migrations; run_migrations()"
        env:
          DATABASE_URL: sqlite:///./ci.db
          SECRET_KEY: ci

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev,postgres]"
      - name: Migrations + tests on PostgreSQL
        run: |
          python -c "from classpulse.main import run_migrations; run_migrations()"
          pytest -q
        env:
          DATABASE_URL: postgresql+psycopg://postgres:ci@localhost:5432/postgres
          SECRET_KEY: ci

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t classpulse:ci .
