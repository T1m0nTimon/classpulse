# Quick start (SQLite, no domain):      docker compose up -d app
# Production (PostgreSQL + HTTPS):      set DOMAIN etc. in .env, then: docker compose --profile prod up -d
services:
  app:
    build: .
    image: classpulse:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/classpulse.db}
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - classpulse-data:/data

  db:
    profiles: ["prod"]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: classpulse
      POSTGRES_USER: classpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classpulse"]
      interval: 5s

  caddy:
    profiles: ["prod"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [app]

volumes:
  classpulse-data:
  postgres-data:
  caddy-data:
